<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rabbit-hole</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <img src="icons/icon48.png" width="22" height="22" alt="rabbit-hole logo" class="header-logo">
        <h1 class="header-title">rabbit-hole</h1>
      </div>
    </header>

    <!-- Notification Banner -->
    <div id="statusBanner" class="status-banner hidden" role="status" aria-live="polite"></div>

    <!-- Scheduling Form -->
    <form id="scheduleForm" class="schedule-form" novalidate>
      <!-- Search Engine Selector -->
      <div class="form-group">
        <label class="form-label">Search Engine</label>
        <div class="engine-selector" role="radiogroup" aria-label="Search Engine">
          <label class="engine-option" for="engineGoogle">
            <input type="radio" id="engineGoogle" name="searchEngine" value="google" checked class="engine-radio">
            <span class="engine-chip google">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
              Google
            </span>
          </label>
          <label class="engine-option" for="engineYoutube">
            <input type="radio" id="engineYoutube" name="searchEngine" value="youtube" class="engine-radio">
            <span class="engine-chip youtube">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
              YouTube
            </span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="queryInput" class="form-label">
          Search Queries
          <span class="label-hint">(one per line; yt: or youtube: prefix supported)</span>
        </label>
        <textarea
          id="queryInput"
          class="form-textarea"
          rows="3"
          placeholder="e.g. latest tech news&#10;yt: lo-fi chill beats&#10;https://example.com"
          required
        ></textarea>
      </div>

      <!-- Custom Date & Time Controls (No native date picker) -->
      <div class="form-group">
        <label class="form-label">Trigger Date &amp; Time</label>
        
        <!-- Target Time Preview Card -->
        <div class="dt-display-card">
          <div class="dt-display-main">
            <svg class="dt-display-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="dtDisplayText" class="dt-display-text">Today, 12:15 PM</span>
          </div>
          <span id="dtRelativeText" class="dt-relative-text">in 15 minutes</span>
        </div>

        <!-- Date & Time Button Controls -->
        <div class="dt-controls">
          <!-- Date Row -->
          <div class="dt-row">
            <span class="dt-row-label">Day:</span>
            <div class="btn-group">
              <button type="button" id="btnDateToday" class="btn-chip" title="Reset date to today">Today</button>
              <button type="button" id="btnDateWeekend" class="btn-chip" title="Schedule for upcoming weekend">Weekend</button>
              <button type="button" id="btnDatePlus1" class="btn-chip" title="Advance 1 day">+1 Day</button>
            </div>
          </div>

          <!-- Time Row -->
          <div class="dt-row">
            <span class="dt-row-label">Time:</span>
            <div class="btn-group">
              <button type="button" id="btnTimeMinus15" class="btn-chip" title="Subtract 15 minutes">-15m</button>
              <button type="button" id="btnTimePlus15" class="btn-chip" title="Add 15 minutes">+15m</button>
              <button type="button" id="btnTimePlus60" class="btn-chip" title="Add 1 hour">+1h</button>
            </div>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary">
        Schedule Queries
      </button>
    </form>

    <!-- Navigation Tabs (Scheduled vs History) -->
    <nav class="tab-nav" role="tablist">
      <button type="button" id="tabBtnScheduled" class="tab-btn active" role="tab" aria-selected="true" aria-controls="scheduledSection">
        <span>Scheduled</span>
        <span id="scheduledCountBadge" class="tab-badge">0</span>
      </button>
      <button type="button" id="tabBtnHistory" class="tab-btn" role="tab" aria-selected="false" aria-controls="historySection">
        <span>History</span>
        <span id="historyCountBadge" class="tab-badge">0</span>
      </button>
    </nav>

    <!-- Scheduled Tasks List Section -->
    <section id="scheduledSection" class="tasks-section" role="tabpanel" aria-labelledby="tabBtnScheduled">
      <div id="scheduledTaskList" class="task-list">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- History Tasks List Section -->
    <section id="historySection" class="tasks-section hidden" role="tabpanel" aria-labelledby="tabBtnHistory">
      <div id="historyToolbar" class="history-toolbar hidden">
        <label class="select-all-control">
          <input type="checkbox" id="selectAllHistory" aria-label="Select all finished tasks">
          <span>Select all</span>
        </label>
        <button type="button" id="clearAllHistory" class="btn-clear-all" disabled>Clear all</button>
      </div>
      <div id="historyTaskList" class="task-list">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
